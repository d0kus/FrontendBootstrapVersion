<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="180" height="44" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Cinema Icon Emblem -->
  <g transform="translate(2, 4)" filter="url(#glow)">
    <!-- Rounded Shield/Tile Background -->
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#brandGrad)" />
    
    <!-- Film Strip Holes (Top & Bottom) -->
    <rect x="5" y="4" width="4" height="3" rx="1" fill="#121316" opacity="0.65" />
    <rect x="16" y="4" width="4" height="3" rx="1" fill="#121316" opacity="0.65" />
    <rect x="27" y="4" width="4" height="3" rx="1" fill="#121316" opacity="0.65" />
    
    <rect x="5" y="29" width="4" height="3" rx="1" fill="#121316" opacity="0.65" />
    <rect x="16" y="29" width="4" height="3" rx="1" fill="#121316" opacity="0.65" />
    <rect x="27" y="29" width="4" height="3" rx="1" fill="#121316" opacity="0.65" />

    <!-- Center Play / Projector Triangle -->
    <polygon points="14,12 26,18 14,24" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <!-- "404" Primary Numerals -->
  <text x="48" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="url(#textGrad)" letter-spacing="0.5">404</text>
  
  <!-- Orange Dot Separator -->
  <circle cx="94" cy="20" r="2.5" fill="#f97316" />

  <!-- "CINEMA" Subtitle -->
  <text x="101" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f97316" letter-spacing="1.5">CINEMA</text>
  
  <!-- Subtle Tagline Underneath -->
  <text x="49" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#94a3b8" letter-spacing="2.2" opacity="0.85">NEXT-GEN THEATER</text>
</svg>
